<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mia Calendar</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 14a3 3 0 0 0 3-3V7a3 3 0 1 0-6 0v4a3 3 0 0 0 3 3Z"
                fill="currentColor"
              />
              <path
                d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.07A7 7 0 0 0 19 11Z"
                fill="currentColor"
              />
            </svg>
          </span>
          <div>
            <h1>Mia Calendar</h1>
            <ol class="steps" id="steps">
              <li class="active" data-step="1">Paste</li>
              <li data-step="2">Review</li>
              <li data-step="3">Send</li>
            </ol>
          </div>
        </div>
      </header>

      <div class="scroll">
        <section class="paste-block" id="pasteBlock">
          <label class="field-label" for="paste">Paste invite</label>
          <textarea
            id="paste"
            rows="2"
            placeholder="LSEG Presentation · Thu Oct 8, 2:00–3:00pm · Room 608"
          ></textarea>
        </section>

        <button
          type="button"
          class="paste-collapsed"
          id="pasteCollapsed"
          hidden
        >
          Pasted invite <span>(tap to edit)</span>
        </button>

        <form id="form" class="form">
          <div class="field">
            <label class="field-label" for="title">Title</label>
            <textarea
              id="title"
              class="title-area"
              rows="1"
              required
              placeholder="Meeting title"
            ></textarea>
          </div>

          <div class="field">
            <label class="field-label" for="calendar">Calendar</label>
            <div class="select-wrap">
              <span class="dot" id="calendarDot" style="background: #7c3aed"></span>
              <select id="calendar">
                <option value="manual" data-color="#4F46E5">Personal</option>
                <option value="work" data-color="#7C3AED" selected>Work</option>
                <option value="extension" data-color="#818CF8">Extension</option>
              </select>
            </div>
          </div>

          <div class="when-row">
            <div class="field grow">
              <label class="field-label" for="date">Date</label>
              <input id="date" type="date" required />
            </div>
            <label class="allday-toggle">
              <span>All day</span>
              <input id="allDay" type="checkbox" role="switch" />
            </label>
          </div>

          <div class="times" id="timesRow">
            <div class="field">
              <label class="field-label" for="startTime">Starts</label>
              <input id="startTime" type="time" required />
            </div>
            <div class="duration" id="duration">1 hr</div>
            <div class="field">
              <label class="field-label" for="endTime">Ends</label>
              <input id="endTime" type="time" required />
            </div>
          </div>

          <div class="split-row">
            <div class="field grow">
              <label class="field-label" for="location">Location</label>
              <input id="location" type="text" placeholder="Room, Zoom, address…" />
            </div>
            <div class="field reminder-field">
              <label class="field-label" for="reminder">Reminder</label>
              <select id="reminder">
                <option value="">None</option>
                <option value="10">10 min</option>
                <option value="60">1 hr</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="notes">Notes</label>
            <textarea
              id="notes"
              rows="1"
              placeholder="Description / organizer…"
            ></textarea>
          </div>
        </form>
      </div>

      <footer class="footer">
        <p id="status" class="status" hidden></p>
        <button id="submit" type="submit" form="form" class="btn primary send">
          Send to Mia
        </button>
      </footer>
    </div>

    <div id="toast" class="toast" hidden>Sent to Mia ✓</div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
